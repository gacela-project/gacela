permissions:
    allow:
        - Bash(composer *)
        - Bash(./vendor/bin/*)
        - Bash(./bin/gacela *)
        - Bash(git *)
        - Bash(gh *)
        - Bash(timeout *)
        - Bash(ls *)
        - Bash(wc *)
    deny:
        - Bash(rm -rf:*)
        - Bash(rm -fr:*)
        - Bash(sudo:*)
        - Bash(shutdown:*)
        - Bash(reboot:*)
        - Bash(mkfs:*)
