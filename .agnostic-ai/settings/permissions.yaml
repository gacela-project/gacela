permissions:
    allow:
        - shell(composer *)
        - shell(./vendor/bin/*)
        - shell(./bin/gacela *)
        - shell(git *)
        - shell(gh *)
        - shell(timeout *)
        - shell(ls *)
        - shell(wc *)
    deny:
        - shell(git push --force:*)
        - shell(git push --force-with-lease:*)
        - shell(git push -f:*)
        - shell(rm -rf:*)
        - shell(rm -fr:*)
        - shell(sudo:*)
        - shell(shutdown:*)
        - shell(reboot:*)
        - shell(mkfs:*)
