permissions:
    allow:
        - Bash(composer *)
        - Bash(./vendor/bin/*)
        - Bash(./bin/gacela *)
        - Bash(git *)
        - Bash(gh *)
        - Bash(timeout *)
        - Bash(ls *)
        - Bash(wc *)
    ask:
        - Edit(.github/**)
        - Edit(composer.lock)
    deny:
        - Bash(git push --force*)
        - Bash(git push -f*)
        - Bash(rm -rf:*)
        - Bash(rm -fr:*)
        - Bash(sudo:*)
        - Bash(shutdown:*)
        - Bash(reboot:*)
        - Bash(mkfs:*)
