name: Infection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    name: "Mutation testing (full, min MSI 90%)"
    runs-on: ubuntu-latest
    # The longest job in the repository: every mutant, not just the diff.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: xdebug
          tools: composer

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: "infection-php-8.4-${{ hashFiles('**/composer.lock') }}"
          restore-keys: "infection-php-8.4-"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Assert the mutation score has not regressed
        env:
          XDEBUG_MODE: coverage
        run: vendor/bin/infection --threads=max --min-msi=90 --min-covered-msi=90 --no-progress --show-mutations=max
