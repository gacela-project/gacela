# https://help.github.com/en/categories/automating-your-workflow-with-github-actions
#
# Performance regression guard: benchmarks the PR base branch, then benchmarks
# the PR head against that stored baseline. The assertion configured in
# phpbench.json (mode(variant.time.avg) <= mode(baseline.time.avg) +/- 10%)
# fails the job when a benchmarked path regresses by more than 10%.
# A one-time cache-read security transition is scoped in .github/phpbench/compare.py.
#
# Only the `gate` group blocks the merge: those are the stable macro benches.
# The `micro` group (sub-microsecond subjects, where timer quantization alone
# moves the mode by ~10%) runs afterwards as a non-blocking informational
# report. See tests/Benchmark/README.md for the group taxonomy.

on:
  pull_request:

name: PHPBench

permissions:
  contents: read

jobs:

  regression-guard:
    name: "Performance regression guard"
    runs-on: ubuntu-latest
    # Observed 1.5-6 min. The widest margin of the fast jobs: it runs composer
    # install twice, once for the base checkout and once for the head, so a
    # cold cache legitimately costs several times the median.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the base branch can be checked out for the baseline run.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: "phpbench-php-8.4-${{ hashFiles('**/composer.lock') }}"
          restore-keys: "phpbench-php-8.4-"

      - name: Capture comparison plan before changing checkouts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cp .github/phpbench/compare.py "$RUNNER_TEMP/phpbench-compare.py"
          python3 "$RUNNER_TEMP/phpbench-compare.py" plan "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/phpbench-plan.json"
          cat "$RUNNER_TEMP/phpbench-plan.json"

      - name: Benchmark base commit and store baselines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout --detach "$BASE_SHA"
          composer install --no-interaction --no-progress
          python3 "$RUNNER_TEMP/phpbench-compare.py" base "$RUNNER_TEMP/phpbench-plan.json"

      - name: Restore PR head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git checkout --detach "$HEAD_SHA"

      - name: Install PR head dependencies
        run: composer install --no-interaction --no-progress

      - name: Assert performance against matching base selections
        run: python3 "$RUNNER_TEMP/phpbench-compare.py" gate "$RUNNER_TEMP/phpbench-plan.json"

      - name: Report non-gating benches against the base baseline (informational, non-blocking)
        continue-on-error: true
        run: python3 "$RUNNER_TEMP/phpbench-compare.py" info "$RUNNER_TEMP/phpbench-plan.json"

      - name: Test benchmark comparison plan
        run: python3 -B -m unittest discover -s .github/phpbench -p 'test_*.py'
