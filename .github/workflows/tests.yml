# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

on:
  # Manual re-run lever. The 2026-08-06 Actions incident throttled webhooks to
  # ~15%, so pushes and pull requests silently created no run at all, and there
  # was no way to ask for one after the fact.
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

name: Tests

jobs:

  tests:
    name: "PHP version ${{ matrix.php-version }}, deps. ${{ matrix.dependencies }} in ${{ matrix.operating-system }}"
    runs-on: ${{ matrix.operating-system }}
    # Observed 1-2.5 min. The margin covers a Windows runner installing
    # dependencies from a cold cache.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dependencies: [ "lowest", "locked", "highest" ]
        php-version: [ "8.3", "8.4", "8.5" ]
        operating-system:
          - "ubuntu-latest"
          - "windows-latest"
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer

      - name: Get composer cache directory
        id: composer-cache
        run: echo "::set-output name=dir::$(composer config cache-files-dir)"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: "php-${{ matrix.php-version }}-${{ matrix.dependencies }}-${{ hashFiles('**/composer.lock') }}"
          restore-keys: "php-${{ matrix.php-version }}-${{ matrix.dependencies }}-"

      - name: "Install lowest dependencies"
        if: ${{ matrix.dependencies == 'lowest' }}
        run: "composer update --prefer-lowest --no-interaction --no-progress"

      - name: "Install locked dependencies"
        if: ${{ matrix.dependencies == 'locked' }}
        run: "composer install --no-interaction --no-progress"

      - name: "Install highest dependencies"
        if: ${{ matrix.dependencies == 'highest' }}
        run: "composer update --no-interaction --no-progress"

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite unit

      - name: Run integration tests
        run: vendor/bin/phpunit --testsuite integration

      - name: Run feature tests
        run: vendor/bin/phpunit --testsuite feature
